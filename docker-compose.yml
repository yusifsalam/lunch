# Lunch app. Single service, SQLite in a bind-mounted ./data dir — no database
# container. Joins the shared Caddy ingress on the external `edge` network like
# the other app stacks (`docker network create edge` if it doesn't exist yet,
# e.g. for a local run) and publishes no host ports.
#
# Required in .env: SITE_HOSTNAME, SUPERADMIN_PASSCODE, SESSION_SECRET.
# Optional: SITE_PASSCODE/ADMIN_PASSCODE (first-boot seed for the Default
# tenant's passcodes; manage tenants on /tenants afterwards).

name: lunch

services:
  lunch-web:
    build:
      context: .
      args:
        # Build-time: baked into the Astro manifest (security.allowedDomains).
        SITE_HOSTNAME: ${SITE_HOSTNAME:?SITE_HOSTNAME must be set}
    image: lunch-web:latest
    restart: unless-stopped
    environment:
      SITE_PASSCODE: ${SITE_PASSCODE:-}
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-}
      SUPERADMIN_PASSCODE: ${SUPERADMIN_PASSCODE:?SUPERADMIN_PASSCODE must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
    volumes:
      # SQLite database file (and its WAL) live here, surviving deploys.
      - ./data:/app/data
    networks:
      edge:
        aliases:
          - lunch-web

networks:
  edge:
    external: true
